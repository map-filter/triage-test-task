<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; margin: .25rem 0 0; padding: .5rem; border: 1px solid #ccc; }
    #status { margin: 1rem 0 .5rem; }
    #status[data-kind="manual_review"], #status[data-kind="invalid_input"] { padding: .5rem; border-left: .25rem solid #b00020; background: #fdecee; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite" hidden></p>
  <section id="result" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <span>Черновик ответа</span>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    import { INVALID_INPUT_VIEW, LOADING_VIEW, MANUAL_REVIEW_VIEW, viewFor } from "/view.mjs";

    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    let lastRequest = 0;

    function render(view) {
      status.textContent = view.message;
      status.dataset.kind = view.kind;
      status.hidden = false;
      topic.textContent = view.topic;
      draft.textContent = view.draft;
      result.hidden = view.kind !== "ready";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++lastRequest;
      if (message.value.trim() === "") {
        render(INVALID_INPUT_VIEW);
        return;
      }
      render(LOADING_VIEW);
      button.disabled = true;
      let view = MANUAL_REVIEW_VIEW;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
          signal: AbortSignal.timeout(5_000),
        });
        view = viewFor(reply.status, await reply.json());
      } catch {
        view = MANUAL_REVIEW_VIEW;
      }
      if (requestId !== lastRequest) return;
      button.disabled = false;
      render(view);
    });
  </script>
</body>
</html>
